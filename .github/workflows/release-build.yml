name: Release build

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build and test
        required: true
        type: string
      publish_release:
        description: Publish the built files to a GitHub release
        required: true
        type: boolean

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package versions
        if: startsWith(inputs.checkout_ref, 'refs/tags/v')
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          expected = os.environ["CHECKOUT_REF"].removeprefix("refs/tags/v")
          python_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf8"))["project"]["version"]
          frontend_version = json.loads(Path("frontend/package.json").read_text(encoding="utf8"))["version"]
          versions = {"pyproject.toml": python_version, "frontend/package.json": frontend_version}
          mismatches = {path: version for path, version in versions.items() if version != expected}
          if mismatches:
              details = ", ".join(f"{path}={version}" for path, version in mismatches.items())
              raise SystemExit(f"Tag v{expected} does not match {details}")
          print(f"Release tag v{expected} matches all package versions.")
          PY

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Browser-test workflow studio
        working-directory: frontend
        run: xvfb-run -a npm run test:browser

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            electron_builder_args: --linux AppImage deb rpm
            artifact-name: gofer-flow-linux
            artifact-glob: |
              frontend/release/*.AppImage
              frontend/release/*.AppImage.blockmap
              frontend/release/*.deb
              frontend/release/*.rpm
              frontend/release/latest-linux.yml
              frontend/release/gof-linux-x64
              frontend/release/checksums-linux.txt
          - name: windows
            os: windows-latest
            electron_builder_args: --win nsis
            artifact-name: gofer-flow-windows
            artifact-glob: |
              frontend/release/*.exe
              frontend/release/*.exe.blockmap
              frontend/release/latest.yml
              frontend/release/checksums-windows.txt
          - name: macos
            os: macos-latest
            electron_builder_args: --mac dmg
            artifact-name: gofer-flow-macos
            artifact-glob: |
              frontend/release/*.dmg
              frontend/release/*.dmg.blockmap
              frontend/release/*.zip
              frontend/release/*.zip.blockmap
              frontend/release/latest-mac.yml
              frontend/release/gof-macos-*
              frontend/release/checksums-macos.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --extra dev --extra xlsx --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron packages
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run backend:build
          npm run build
          npx electron-builder ${{ matrix.electron_builder_args }} --publish=never

      - name: Copy Linux CLI artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp dist/gof frontend/release/gof-linux-x64
          chmod +x frontend/release/gof-linux-x64

      - name: Build Linux CLI packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-cli-linux.sh dist/gof frontend/release

      - name: Copy Windows CLI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/gof.exe frontend/release/gof-windows-x64.exe

      - name: Copy macOS CLI artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          case "$arch" in
            arm64) artifact_arch="arm64" ;;
            x86_64) artifact_arch="x64" ;;
            *) artifact_arch="$arch" ;;
          esac
          cp dist/gof "frontend/release/gof-macos-${artifact_arch}"
          chmod +x "frontend/release/gof-macos-${artifact_arch}"

      - name: Generate Linux checksums
        if: runner.os == 'Linux'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.AppImage *.AppImage.blockmap *.deb *.rpm latest-linux.yml gof-linux-x64; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux release files found for checksums" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums-linux.txt
          cat checksums-linux.txt

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        working-directory: frontend/release
        shell: pwsh
        run: |
          Get-ChildItem -File |
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml gof-macos-*; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found for checksums" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: Publish release
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gofer-flow-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
